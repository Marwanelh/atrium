<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atrium brand preview</title>
<style>
  :root { --fg: #0b0f14; --muted: #5b6472; --bg: #ffffff; --line: #e3e7ec; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eef2f7; --muted: #97a1b0; --bg: #0b0f14; --line: #222a35; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; background: var(--bg); color: var(--fg);
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 22px; }
  section { border: 1px solid var(--line); border-radius: 12px; padding: 26px 30px; margin-bottom: 22px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 20px; text-transform: uppercase; letter-spacing: .06em; }
  .sizes { display: flex; align-items: flex-end; gap: 34px; flex-wrap: wrap; }
  .size { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .size span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup b { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .bubble { width: 56px; height: 56px; border-radius: 18px; background: var(--accent);
            display: flex; align-items: center; justify-content: center; }
  .row { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  svg { display: block; }
</style>
</head>
<body>

<h1>Atrium — brand preview</h1>

<section>
  <h2>Legibility test — the mark at real interface sizes</h2>
  <div class="sizes">
    <div class="size"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z"/></svg><span>16</span></div>
    <div class="size"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z"/></svg><span>20</span></div>
    <div class="size"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z"/></svg><span>24</span></div>
    <div class="size"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z"/></svg><span>32</span></div>
    <div class="size"><svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z"/></svg><span>48</span></div>
    <div class="size"><svg viewBox="0 0 24 24" width="72" height="72" fill="currentColor"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z"/></svg><span>72</span></div>
  </div>
</section>

<section>
  <h2>Applications</h2>
  <div class="row">
    <div class="lockup">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z"/></svg>
      <b>Atrium</b>
    </div>
    <div class="bubble">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z" fill="#ffffff"/></svg>
    </div>
    <div class="size"><svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor"><path d="M2.5 21.5V12A9.5 9.5 0 0 1 21.5 12V21.5H16V10A4 4 0 0 0 8 10V21.5Z"/></svg><span>app icon</span></div>
  </div>
</section>

</body>
</html>
